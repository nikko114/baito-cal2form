<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>シフト転記</title>
    <meta name="description" content="カレンダーで入れたシフト希望を、Googleフォームに書き写すための一覧にする" />
    <meta name="theme-color" content="#f3f3f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111115" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="シフト転記" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main id="view">
      <noscript>JavaScript をオンにして開いてね。</noscript>
    </main>

    <div id="sheet" class="sheet" role="region" aria-label="選択肢" hidden></div>

    <nav id="tabbar" class="tabbar" aria-label="画面の切り替え">
      <button type="button" data-tab="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
          <path d="M3.5 10h17M8 3v4M16 3v4" />
        </svg>
        <span>カレンダー</span>
      </button>
      <button type="button" data-tab="list">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10.5 6.5h9.5M10.5 12h9.5M10.5 17.5h9.5M3.5 6.5l1.6 1.6 2.6-2.6M3.5 12l1.6 1.6 2.6-2.6M3.5 17.5l1.6 1.6 2.6-2.6" />
        </svg>
        <span>一覧</span>
      </button>
      <button type="button" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1" />
          <circle cx="15" cy="7" r="2" />
          <circle cx="9" cy="12" r="2" />
          <circle cx="17" cy="17" r="2" />
        </svg>
        <span>設定</span>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
